[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hla-contract-kit"
version = "0.1.0"
description = "HLA-MEM module manifest and contract validation"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.22",
]

[project.scripts]
hla-contract-check = "hla_contract_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
