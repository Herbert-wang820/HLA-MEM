[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hla-host"
version = "0.1.0"
description = "HLA-MEM host capability adapters and shared FastAPI scaffolding"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]
