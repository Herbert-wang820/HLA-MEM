components:
  schemas:
    Backlog:
      properties:
        pending:
          type: integer
          minimum: 0.0
          title: Pending
        running:
          type: integer
          minimum: 0.0
          title: Running
        deadLettered:
          type: integer
          minimum: 0.0
          title: Deadlettered
        oldestPendingAgeSeconds:
          type: number
          minimum: 0.0
          title: Oldestpendingageseconds
        degraded:
          type: boolean
          title: Degraded
          default: false
      additionalProperties: false
      type: object
      required:
      - pending
      - running
      - deadLettered
      - oldestPendingAgeSeconds
      title: Backlog
    CheckResult:
      properties:
        name:
          type: string
          title: Name
        ready:
          type: boolean
          title: Ready
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      additionalProperties: false
      type: object
      required:
      - name
      - ready
      title: CheckResult
    ConsolidationJob:
      properties:
        jobId:
          type: string
          title: Jobid
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - dead_lettered
          title: Status
        trigger:
          type: string
          enum:
          - turn
          - schedule
          - manual
          title: Trigger
        attempts:
          type: integer
          minimum: 0.0
          title: Attempts
          default: 0
        maxAttempts:
          type: integer
          minimum: 1.0
          title: Maxattempts
        createdAt:
          type: string
          format: date-time
          title: Createdat
        startedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Startedat
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
        lastError:
          anyOf:
          - type: string
          - type: 'null'
          title: Lasterror
      additionalProperties: false
      type: object
      required:
      - jobId
      - status
      - trigger
      - maxAttempts
      - createdAt
      title: ConsolidationJob
    DeadLetter:
      properties:
        deadLetterId:
          type: string
          title: Deadletterid
        jobId:
          type: string
          title: Jobid
        reason:
          type: string
          title: Reason
        attempts:
          type: integer
          minimum: 0.0
          title: Attempts
        createdAt:
          type: string
          format: date-time
          title: Createdat
        replayed:
          type: boolean
          title: Replayed
          default: false
      additionalProperties: false
      type: object
      required:
      - deadLetterId
      - jobId
      - reason
      - attempts
      - createdAt
      title: DeadLetter
    DeadLetterPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DeadLetter'
          type: array
          title: Items
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
        hasMore:
          type: boolean
          title: Hasmore
          default: false
      additionalProperties: false
      type: object
      required:
      - items
      title: DeadLetterPage
    ErrorResponse:
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$
          title: Code
        message:
          type: string
          title: Message
        requestId:
          type: string
          title: Requestid
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - requestId
      title: ErrorResponse
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        module:
          type: string
          title: Module
        version:
          type: string
          title: Version
        time:
          type: string
          format: date-time
          title: Time
      additionalProperties: false
      type: object
      required:
      - module
      - version
      - time
      title: HealthResponse
    JobCreateRequest:
      properties:
        trigger:
          type: string
          enum:
          - turn
          - schedule
          - manual
          title: Trigger
        sessionId:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Sessionid
        episodeIds:
          items:
            type: string
          type: array
          maxItems: 500
          title: Episodeids
        priority:
          type: integer
          maximum: 10.0
          minimum: -10.0
          title: Priority
          default: 0
        scheduledFor:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Scheduledfor
      additionalProperties: false
      type: object
      required:
      - trigger
      title: JobCreateRequest
    JobPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ConsolidationJob'
          type: array
          title: Items
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
        hasMore:
          type: boolean
          title: Hasmore
          default: false
      additionalProperties: false
      type: object
      required:
      - items
      title: JobPage
    ReadinessResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
        module:
          type: string
          title: Module
        checks:
          items:
            $ref: '#/components/schemas/CheckResult'
          type: array
          title: Checks
        time:
          type: string
          format: date-time
          title: Time
      additionalProperties: false
      type: object
      required:
      - status
      - module
      - checks
      - time
      title: ReadinessResponse
    ReplayResult:
      properties:
        deadLetterId:
          type: string
          title: Deadletterid
        jobId:
          type: string
