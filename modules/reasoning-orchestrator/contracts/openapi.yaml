components:
  schemas:
    CheckResult:
      properties:
        name:
          type: string
          title: Name
        ready:
          type: boolean
          title: Ready
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      additionalProperties: false
      type: object
      required:
      - name
      - ready
      title: CheckResult
    Degradation:
      properties:
        memoryDegraded:
          type: boolean
          title: Memorydegraded
          default: false
        personaDegraded:
          type: boolean
          title: Personadegraded
          default: false
        llmDegraded:
          type: boolean
          title: Llmdegraded
          default: false
        reasons:
          items:
            type: string
          type: array
          title: Reasons
      additionalProperties: false
      type: object
      title: Degradation
    ErrorResponse:
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$
          title: Code
        message:
          type: string
          title: Message
        requestId:
          type: string
          title: Requestid
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - requestId
      title: ErrorResponse
    GateConfig:
      properties:
        tau:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Tau
        beta:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Beta
        topK:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Topk
        calibrator:
          type: string
          enum:
          - identity
          - isotonic
          - platt
          title: Calibrator
          default: identity
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
      additionalProperties: false
      type: object
      required:
      - tau
      - beta
      - topK
      - updatedAt
      title: GateConfig
    GateConfigUpdate:
      properties:
        tau:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Tau
        beta:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Beta
        topK:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Topk
        calibrator:
          type: string
          enum:
          - identity
          - isotonic
          - platt
          title: Calibrator
          default: identity
        expectedVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expectedversion
      additionalProperties: false
      type: object
      required:
      - tau
      - beta
      - topK
      title: GateConfigUpdate
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        module:
          type: string
          title: Module
        version:
          type: string
          title: Version
        time:
          type: string
          format: date-time
          title: Time
      additionalProperties: false
      type: object
      required:
      - module
      - version
      - time
      title: HealthResponse
    LLMConfigUpdate:
      properties:
        enabled:
          type: boolean
          title: Enabled
          default: false
        baseUrl:
          type: string
          maxLength: 500
          title: Baseurl
          default: https://api.openai.com/v1
        model:
          type: string
          maxLength: 200
          title: Model
          default: gpt-4o-mini
        apiKey:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: Apikey
        temperature:
          type: number
          maximum: 2.0
          minimum: 0.0
          title: Temperature
          default: 0.7
        maxTokens:
          type: integer
          maximum: 8192.0
          minimum: 1.0
          title: Maxtokens
          default: 512
      additionalProperties: false
      type: object
      title: LLMConfigUpdate
    LLMConfigView:
      properties:
        enabled:
          type: boolean
          title: Enabled
        baseUrl:
          type: string
          title: Baseurl
        model:
          type: string
          title: Model
        apiKeySet:
          type: boolean
          title: Apikeyset
        temperature:
          type: number
          maximum: 2.0
          minimum: 0.0
          title: Temperature
        maxTokens:
          type: integer
          maximum: 8192.0
          minimum: 1.0
          title: Maxtokens
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
      additionalProperties: false
      type: object
      required:
      - enabled
      - baseUrl
      - model
      - apiKeySet
      - temperature
      - maxTokens
      title: LLMConfigView
    ReadinessResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
        module:
          type: string
          title: Module
        checks:
          items:
            $ref: '#/components/schemas/CheckResult'
          type: array
          title: Checks
        time:
          type: string
          format: date-time
          title: Time
      additionalProperties: false
      type: object
      required:
      - status
      - module
      - checks
      - time
      title: ReadinessResponse
    Turn:
      properties:
        turnId:
          type: string
          title: Turnid
        sessionId:
          type: string
          title: Sessionid
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - degraded
          title: Status
        createdAt:
          type: string
          format: date-time
          title: Createdat
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
        degradation:
          $ref: '#/components/schemas/Degradation'
        personaVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Personaversion
        adaptationVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Adaptationversion
        identityProposalId:
          anyOf:
          - type: string
          - type: 'null'
          title: Identityproposalid
      additionalProperties: false
      type: object
      required:
      - turnId
      - sessionId
      - status
      - createdAt
      title: Turn
    TurnAudit:
      properties:
        turnId:
          type: string
          title: Turnid
        retrievalIds:
          items:
            type: string
          type: array
          title: Retrievalids
        gateScore:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Gatescore
        gateThreshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Gatethreshold
        candidatesConsidered:
          type: integer
          maximum: 50.0
          minimum: 0.0
          title: Candidatesconsidered
          default: 0
        usedEpisodeIds:
          items:
            type: string
          type: array
          title: Usedepisodeids
        latencyMs:
          type: number
          minimum: 0.0
          title: Latencyms
          default: 0.0
        degraded:
          type: boolean
          title: Degraded
          default: false
        degradationReasons:
          items:
            type: string
          type: array
          title: Degradationreasons
      additionalProperties: false
      type: object
      required:
      - turnId
      title: TurnAudit
    TurnCreateRequest:
      properties:
        sessionId:
          type: string
          maxLength: 128
          minLength: 1
          title: Sessionid
        message:
          type: string
          maxLength: 8000
          minLength: 1
          title: Message
        stream:
          type: boolean
          title: Stream
          default: true
        clientTimezone:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Clienttimezone
      additionalProperties: false
      type: object
      required:
      - sessionId
      - message
      title: TurnCreateRequest
