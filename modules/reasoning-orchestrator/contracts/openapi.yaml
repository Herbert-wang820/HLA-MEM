      x-permission: reasoning-orchestrator.audit.read
  /internal/v1/gate/config:
    put:
      tags:
      - admin
      summary: 更新门控阈值与校准参数
      operationId: update_gate_config_internal_v1_gate_config_put
      requestBody:
