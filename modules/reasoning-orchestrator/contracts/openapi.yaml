        '504':
          description: Request exceeded the configured timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-capability: reasoning-orchestrator.turn.process.v1
      x-permission: reasoning-orchestrator.turn.create
  /api/reasoning-orchestrator/v1/turns/{turn_id}:
    get:
      tags:
