openapi: 3.1.0
info:
  title: HLA-MEM 推理编排器
  description: 对话回合编排、System-One 门控、记忆检索与降级路径
  version: 0.1.0
paths:
  /internal/health:
    get:
      tags:
      - operations
      summary: Liveness probe
      operationId: health_internal_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /internal/ready:
    get:
      tags:
      - operations
      summary: Readiness probe
      operationId: ready_internal_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: A dependency or required configuration is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /internal/metrics:
    get:
      tags:
      - operations
      summary: Prometheus metrics
      operationId: metrics_endpoint_internal_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
  /api/reasoning-orchestrator/v1/turns:
    post:
      tags:
      - turns
      summary: 处理一个对话回合（SSE 流式）
      operationId: process_turn_api_reasoning_orchestrator_v1_turns_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable key for this turn.
          title: Idempotency-Key
        description: Stable key for this turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnCreateRequest'
      responses:
        '200':
          description: 'Server-sent events: token deltas, then a final done event.'
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Request is structurally valid but semantically invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found or not visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Version or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the configured limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error; no internal details are exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Capability is declared by contract but not implemented yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Dependency unavailable and no safe degradation is possible.
