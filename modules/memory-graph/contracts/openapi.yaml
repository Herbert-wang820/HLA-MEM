components:
  schemas:
    CheckResult:
      properties:
        name:
          type: string
          title: Name
        ready:
          type: boolean
          title: Ready
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      additionalProperties: false
      type: object
      required:
      - name
      - ready
      title: CheckResult
    ConsolidationApplyRequest:
      properties:
        batchId:
          type: string
          maxLength: 128
          minLength: 1
          title: Batchid
        jobId:
          type: string
          maxLength: 128
          minLength: 1
          title: Jobid
        operations:
          items:
            $ref: '#/components/schemas/ConsolidationOperation'
          type: array
          maxItems: 5000
          minItems: 1
          title: Operations
      additionalProperties: false
      type: object
      required:
      - batchId
      - jobId
      - operations
      title: ConsolidationApplyRequest
    ConsolidationApplyResult:
      properties:
        batchId:
          type: string
          title: Batchid
        appliedCount:
          type: integer
          minimum: 0.0
          title: Appliedcount
        skippedCount:
          type: integer
          minimum: 0.0
          title: Skippedcount
        maxWeight:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Maxweight
      additionalProperties: false
      type: object
      required:
      - batchId
      - appliedCount
      - skippedCount
      - maxWeight
      title: ConsolidationApplyResult
    ConsolidationOperation:
      properties:
        operation:
          type: string
          enum:
          - reinforce
          - forget
          - distill
          title: Operation
        edgeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Edgeid
        sourceEpisodeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceepisodeid
        targetEpisodeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Targetepisodeid
        episodeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Episodeid
        weightDelta:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Weightdelta
        hubId:
          anyOf:
          - type: string
          - type: 'null'
          title: Hubid
      additionalProperties: false
      type: object
      required:
      - operation
      title: ConsolidationOperation
    Episode:
      properties:
        episodeId:
          type: string
          title: Episodeid
        tenantId:
          type: string
          title: Tenantid
        sessionId:
          type: string
          title: Sessionid
        content:
          type: string
          title: Content
        occurredAt:
          type: string
          format: date-time
          title: Occurredat
        source:
          type: string
          title: Source
        metadata:
          additionalProperties:
            type: string
          type: object
          title: Metadata
        contentHash:
          type: string
          title: Contenthash
        retracted:
          type: boolean
          title: Retracted
          default: false
        retractedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Retractedat
        retractReason:
          anyOf:
          - type: string
          - type: 'null'
          title: Retractreason
        createdAt:
          type: string
          format: date-time
          title: Createdat
      additionalProperties: false
      type: object
      required:
      - episodeId
      - tenantId
      - sessionId
      - content
      - occurredAt
      - source
      - contentHash
      - createdAt
      title: Episode
    EpisodeRetractRequest:
      properties:
        reasonCode:
          type: string
          maxLength: 64
          minLength: 1
          title: Reasoncode
        note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - reasonCode
      title: EpisodeRetractRequest
    EpisodeWriteRequest:
      properties:
        sessionId:
          type: string
          maxLength: 128
          minLength: 1
          title: Sessionid
        content:
          type: string
          maxLength: 20000
          minLength: 1
          title: Content
        occurredAt:
          type: string
          format: date-time
          title: Occurredat
        source:
          type: string
          maxLength: 64
          minLength: 1
          title: Source
          default: conversation
        metadata:
          additionalProperties:
            type: string
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - sessionId
      - content
      - occurredAt
      title: EpisodeWriteRequest
    ErrorResponse:
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)+$
          title: Code
        message:
          type: string
          title: Message
        requestId:
          type: string
          title: Requestid
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - requestId
      title: ErrorResponse
    GraphEdge:
      properties:
        edgeId:
          type: string
          title: Edgeid
        sourceId:
          type: string
          title: Sourceid
        targetId:
          type: string
          title: Targetid
        weight:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Weight
      additionalProperties: false
      type: object
      required:
      - edgeId
      - sourceId
      - targetId
      - weight
      title: GraphEdge
    GraphNode:
      properties:
        nodeId:
          type: string
